name: 1.部署 流水线

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 构建dist产物
        run: |
          echo "=== 开始构建流程 ==="
          echo "Node 版本: $(node --version)"
          echo "Yarn 版本: $(yarn --version)"
          echo "当前目录: $(pwd)"
          echo "=== 执行 yarn build ==="
          yarn build --verbose
        env:
          NODE_ENV: production

#      - name: 上传dist产物到服务器
#        uses: appleboy/scp-action@v0.1.7
#        with:
#          host: ${{ secrets.SERVER_HOST }}
#          username: ${{ secrets.SERVER_USER }}
#          key: ${{ secrets.SERVER_SSH_KEY }}
#          source: "dist/spa/**"
#          target: "/opt/1panel/www/sites/twofast.cn/index"
#          strip_components: 2

      - name: 使用 rsync 上传dist产物到服务器
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --progress
          path: "dist/spa/**"
          remote_path: "/opt/1panel/www/sites/twofast.cn/index"
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
