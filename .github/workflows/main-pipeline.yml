name: Build & Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production
        run: yarn build
        env:
          NODE_ENV: production
      
      - name: Verify build output
        run: |
          if [ ! -d "dist/spa" ]; then
            echo "Build failed - dist/spa not found"
            ls -la
            exit 1
          fi
          echo "Build successful!"
          ls -la dist/spa/
