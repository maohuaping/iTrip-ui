name: 2.通知 流水线

on:
  workflow_run:
    workflows: ["1.部署 流水线"]
    types:
      - completed

# 添加权限配置
permissions:
  actions: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: 获取工作流明细
        id: workflow_details
        run: |
          set -e
          # 获取工作流运行详情
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}")
          
          # 检查 API 响应
          if [ "$(echo "$response" | jq -r '.message')" != "null" ]; then
            echo "Error: $(echo "$response" | jq -r '.message')"
            exit 1
          fi
          
          # 解析开始和结束时间
          start_time=$(echo "$response" | jq -r '.run_started_at')
          end_time=$(echo "$response" | jq -r '.updated_at')
          
          # 使用 jq 进行时间计算
          start_epoch=$(echo "$response" | jq -r '.run_started_at | fromdateiso8601')
          end_epoch=$(echo "$response" | jq -r '.updated_at | fromdateiso8601')
          duration=$((end_epoch - start_epoch))
          
          # 处理负数情况
          if [ $duration -lt 0 ]; then
            duration=0
          fi
          
          # 格式化为“X分Y秒”
          duration_min=$((duration / 60))
          duration_sec=$((duration % 60))
          if [ $duration_min -gt 0 ]; then
            duration_human="${duration_min}分${duration_sec}秒"
          else
            duration_human="${duration_sec}秒"
          fi

          echo "duration=$duration" >> $GITHUB_OUTPUT
          echo "duration_human=$duration_human" >> $GITHUB_OUTPUT
          echo "start_time=$start_time" >> $GITHUB_OUTPUT
          echo "end_time=$end_time" >> $GITHUB_OUTPUT
          echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT

          conclusion_cn="未知"
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            conclusion_cn="成功"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            conclusion_cn="失败"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "cancelled" ]; then
            conclusion_cn="已取消"
          fi
          echo "conclusion_cn=$conclusion_cn" >> $GITHUB_OUTPUT
          export TZ='Asia/Shanghai'
          start_time_local=$(date -d "$start_time" +"%H:%M:%S")
          end_time_local=$(date -d "$end_time" +"%H:%M:%S")
          echo "start_time_local=$start_time_local" >> $GITHUB_OUTPUT
          echo "end_time_local=$end_time_local" >> $GITHUB_OUTPUT

          # 新增：输出短 SHA
          short_sha=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-8)
          echo "short_sha=$short_sha" >> $GITHUB_OUTPUT

          commit_time_iso="${{ github.event.workflow_run.head_commit.timestamp }}"
          commit_time_local=$(date -d "$commit_time_iso" +"%Y-%m-%d %H:%M:%S")
          echo "commit_time_local=$commit_time_local" >> $GITHUB_OUTPUT

          # 获取 commit message
          commit_message="${{ github.event.workflow_run.head_commit.message }}"
          echo "==[commit_message]==="
          echo "$commit_message"
          echo "===================="

          # 解析 type、scope、subject
          first_line="$(echo "$commit_message" | head -n1)"
          if [[ "$first_line" =~ ^([a-z]+)(\(([^\)]+)\))?:[[:space:]]*(.*) ]]; then
            type="${BASH_REMATCH[1]}"
            scope="${BASH_REMATCH[3]}"
            subject="${BASH_REMATCH[4]}"
          else
            type="other"
            scope=""
            subject="$first_line"
          fi

          echo "==[解析结果]==="
          echo "type: $type"
          echo "scope: $scope"
          echo "subject: $subject"
          echo "================"

          # 容错处理
          [ -z "$type" ] && type="other"
          [ -z "$subject" ] && subject="无主题"
          [ -z "$scope" ] && scope=""

          # 解析 body（去掉首行）
          body="$(echo "$commit_message" | tail -n +2)"
          [ -z "$body" ] && body="无详细内容"
          echo "body: $body"

          # 类型转义
          case "$type" in
            feat)    type_cn="新增功能"; color="#27ae60";;
            fix)     type_cn="修复缺陷"; color="#e74c3c";;
            chore)   type_cn="日常维护任务"; color="#7f8c8d";;
            docs)    type_cn="文档变更"; color="#f39c12";;
            style)   type_cn="样式调整"; color="#8e44ad";;
            refactor)type_cn="重构代码"; color="#2980b9";;
            test)    type_cn="测试相关"; color="#16a085";;
            build)   type_cn="构建系统或依赖项更改"; color="#34495e";;
            ci)      type_cn="持续集成相关"; color="#2d3436";;
            revert)  type_cn="回滚提交"; color="#b2bec3";;
            merge)   type_cn="合并分支操作"; color="#2980b9";;
            wip)     type_cn="临时提交"; color="#f39c12";;
            init)    type_cn="初始化项目"; color="#00b894";;
            *)       type_cn="其他"; color="#333";;
          esac

          echo "type_cn: $type_cn"
          echo "color: $color"

          # 输出类型内容
          echo "commit_type_cn=$type_cn" >> $GITHUB_OUTPUT
          echo "commit_type_color=$color" >> $GITHUB_OUTPUT

          # 输出范围内容（如为空则输出空字符串）
          echo "commit_scope=$scope" >> $GITHUB_OUTPUT

          # 输出主题内容
          echo "commit_subject=$(jq -Rs . <<<"$subject")" >> $GITHUB_OUTPUT

          # 输出正文内容
          echo "commit_body<<EOF" >> $GITHUB_OUTPUT
          echo "$body"
          echo "EOF" >> $GITHUB_OUTPUT

          # 输出正文HTML（ul/li 或 div）
          if echo "$body" | grep -q '^- '; then
            commit_body_html=$(echo "$body" | sed 's/^-\s*/<li>/;s/$/<\/li>/' | awk 'BEGIN{print "<ul style=\"margin:0;padding:0 0 0 18px;color:#444;font-size:17px;line-height:2;\">"}{print}END{print "</ul>"}')
          else
            commit_body_html="<div style=\"color:#444;font-size:17px;line-height:2;\">$body</div>"
          fi
          echo "==[commit_body_html]==="
          echo "$commit_body_html"
          echo "======================"
          echo "commit_body_html=$(jq -Rs . <<<"$commit_body_html")" >> $GITHUB_OUTPUT

          # 获取分支名
          branch="${{ github.event.workflow_run.head_branch }}"
          echo "branch=$branch" >> $GITHUB_OUTPUT

          # 获取提交人
          commit_author="${{ github.event.workflow_run.head_commit.author.name }}"
          echo "commit_author=$commit_author" >> $GITHUB_OUTPUT

      - name: Get detailed job information
        id: job_details
        run: |
          set -e
          # 获取作业详情
          jobs_response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs")
          
          # 检查 API 响应
          if [ "$(echo "$jobs_response" | jq -r '.message')" != "null" ]; then
            echo "Error: $(echo "$jobs_response" | jq -r '.message')"
            exit 1
          fi
          
          # 解析作业信息
          jobs_info=$(echo "$jobs_response" | jq -r '.jobs[] | "\(.name): \(.conclusion) (\(.completed_at))"')
          if [ -z "$jobs_info" ]; then
            jobs_info="暂无作业信息"
          fi
          
          echo "jobs_info<<EOF" >> $GITHUB_OUTPUT
          echo "$jobs_info" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email notification
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🚀流水线#${{ github.run_number }}更新应用${{ steps.workflow_details.outputs.conclusion_cn }}⚡️${{ steps.workflow_details.outputs.duration_human }}完成"
          to: ${{ secrets.EMAIL_TO }}
          from: "hutoolGe <${{ secrets.EMAIL_USER }}>"
          html_body: |
            <p style="color:gray;font-size:15px;">本邮件由 GitHub Actions 自动发送，请勿回复。</p>
            <div style="background:#f6f8fa;border-radius:8px;padding:18px 20px 14px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04);font-size:16px;line-height:1.7;">
              <div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;">
                <div>
                  <b>状态：</b>
                  <span style="color:${{ steps.workflow_details.outputs.conclusion == 'success' && '#27ae60' || '#e74c3c' }};font-weight:bold;">
                    ${{ steps.workflow_details.outputs.conclusion_cn }}
                  </span>
                </div>
                <a href="https://kkgithub.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
                   style="display:inline-flex;align-items:center;padding:6px 12px;background:#0366d6;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:500;transition:all 0.2s ease;">
                   详情
                </a>
              </div>
              <div>
                <b>耗时：</b>
                <span style="font-weight:bold;">${{ steps.workflow_details.outputs.duration_human }}</span>
              </div>
              <div style="margin-bottom:10px;">
                <b>时间：</b>
                <span style="font-weight:bold;">${{ steps.workflow_details.outputs.start_time_local }}</span>
                <span style="margin:0 8px;color:#888;">—</span>
                <span style="font-weight:bold;">${{ steps.workflow_details.outputs.end_time_local }}</span>
              </div>
            </div>

            <div style="display:flex;align-items:center;margin:18px 0 12px 0;">
              <div style="flex:1;height:1px;background:#e0e0e0;"></div>
              <span style="padding:0 16px;color:#888;font-size:15px;white-space:nowrap;">提交信息</span>
              <div style="flex:1;height:1px;background:#e0e0e0;"></div>
            </div>

            <!-- 提交信息独立容器（假数据） -->
            <div style="background:#f6f8fa;border-radius:8px;padding:18px 18px 16px 18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04);font-size:17px;">
              <!-- 第一行 -->
              <div style="display:flex;align-items:center;margin-bottom:10px;">
                <span style="background:#ececec;color:#888;font-size:15px;padding:3px 10px;border-radius:8px;margin-right:8px;">
                  类型
                </span>
                <span style="color:#333;font-size:17px;font-weight:bold;margin-right:22px;">
                  ${{ steps.workflow_details.outputs.commit_type_cn }}
                </span>
                <!-- 范围 badge -->
                <span style="background:#ececec;color:#888;font-size:15px;padding:3px 10px;border-radius:8px;margin-right:8px;">
                  范围
                </span>
                <span style="color:#333;font-size:17px;font-weight:bold;">
                  ${{ steps.workflow_details.outputs.commit_scope }}
                </span>
              </div>
              <!-- 第二行 -->
              <div style="display:flex;align-items:center;margin-bottom:12px;">
                <span style="background:#ececec;color:#888;font-size:15px;padding:3px 10px;border-radius:8px;margin-right:8px;">
                  主题
                </span>
                <span style="color:#222;font-size:20px;font-weight:bold;line-height:1.4;word-break:break-all;">
                  ${{ fromJson(steps.workflow_details.outputs.commit_subject) }}
                </span>
              </div>
              <!-- 正文 -->
              <div style="background:#f3f4f6;border:1px solid #e0e0e0;border-radius:6px;padding:14px 16px 14px 24px;">
                ${{ fromJson(steps.workflow_details.outputs.commit_body_html) }}
              </div>
            </div>
            
            <!-- 仓库/分支/提交人/提交时间（样式优化版） -->
            <div style="background:#f6f8fa;border-radius:8px;padding:12px 18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04);font-size:15px;line-height:1.7;display:flex;flex-wrap:wrap;gap:18px 32px;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="color:#888;">📦 仓库</span>
                <span style="color:#0366d6;font-weight:bold;">${{ github.repository }}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="color:#888;">🌿 分支</span>
                <span style="color:#0366d6;font-weight:bold;">${{ steps.workflow_details.outputs.branch }}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="color:#888;">👤 提交人</span>
                <span style="font-weight:bold;color:#d6336c;">${{ steps.workflow_details.outputs.commit_author }}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="color:#888;">🕒 提交时间</span>
                <span style="font-weight:bold;color:#d6336c;">${{ steps.workflow_details.outputs.commit_time_local }}</span>
              </div>
            </div>
            
            <div style="display:flex;align-items:center;margin:18px 0 12px 0;">
              <div style="flex:1;height:1px;background:#e0e0e0;"></div>
              <span style="padding:0 16px;color:#888;font-size:15px;white-space:nowrap;">外部跳转</span>
              <div style="flex:1;height:1px;background:#e0e0e0;"></div>
            </div>
            <div style="margin-bottom: 16px;">
              <a href="http://139.224.205.34:10587/e5fdc6d136"
                 style="display:inline-block;padding:8px 20px;margin:4px 8px 4px 0;background:#27ae60;color:#fff;border-radius:4px;text-decoration:none;font-weight:bold;">
                管理服务
              </a>
              <a href="https://kkgithub.com/${{ github.repository }}/actions/metrics/usage"
                 style="display:inline-block;padding:8px 20px;margin:4px 8px 4px 0;background:#f39c12;color:#fff;border-radius:4px;text-decoration:none;font-weight:bold;">
                查看 Actions 用量分析
              </a>
            </div>

            <style>
                .commit-card {
                    background: #f8f9fa;
                    border-radius: 8px;
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                    padding: 18px 18px 18px 18px;
                    margin: 16px 0;
                    font-size: 16px;
                    color: #d6336c;
                    font-weight: bold;
                    white-space: pre-wrap;
                    line-height: 1.6;
                    display: flex;
                    flex-direction: column;
                    min-width: 0;
                }
                .commit-meta-top {
                    display: flex;
                    align-items: center;
                    font-size: 13px;
                    color: #666;
                    font-weight: normal;
                    margin-bottom: 12px;
                    flex-wrap: wrap;
                }
                .commit-message {
                    word-break: break-all;
                    margin-bottom: 18px;
                }
                .commit-meta {
                    display: flex;
                    justify-content: flex-end;
                    align-items: center;
                    font-size: 13px;
                    color: #888;
                    font-weight: normal;
                    flex-wrap: wrap;
                    min-width: 0;
                    margin-top: 12px;
                    word-break: break-all;
                }
            </style>