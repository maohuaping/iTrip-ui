<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作平台 - 优化设计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            100: '#1a1a2e',
                            200: '#16213e',
                            300: '#0f3460',
                            400: '#1e2a3a',
                        },
                        accent: {
                            100: '#4361ee',
                            200: '#3a0ca3',
                            300: '#4cc9f0',
                        }
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            /* 适配刘海屏 */
        }
        
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* 固定导航栏的高度 */
        
        header {
            height: 64px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.9);
            /* 半透明背景 */
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 为主内容区域添加足够的顶部内边距 */
        
        main {
            margin-top: 64px;
            /* 与header高度相同 */
            padding: 2rem 1rem;
            position: relative;
        }
        /* 为锚点添加足够的顶部偏移 */
        
        section[id] {
            scroll-margin-top: 80px;
            /* 比导航栏高度多一些，确保有足够空间 */
        }
        /* 确保每个部分的标题有足够的顶部空间 */
        
        section[id] {
            padding-top: 20px;
        }
        /* 确保内容容器正确定位 */
        
        .container {
            position: relative;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body class="dark bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen" x-data="{ showNewTaskModal: false }">
    <!-- 主内容区域 -->
    <main>
        <div class="container mx-auto">
            <!-- 任务列表部分 -->
            <div id="tasklist-container">
                <!-- 任务列表内容将通过JavaScript加载 -->
            </div>

            <!-- 工作日志部分 -->
            <div id="worklog-container">
                <!-- 工作日志内容将通过JavaScript加载 -->
            </div>

            <!-- 快速访问链接模块 -->
            <div id="quickaccess-container">
                <!-- 快速访问内容将通过JavaScript加载 -->
            </div>

            <!-- 实用工具模块 -->
            <div id="tools-container">
                <!-- 实用工具内容将通过JavaScript加载 -->
            </div>
        </div>
    </main>

    <script>
        // 初始化Alpine.js数据
        document.addEventListener('alpine:init', () => {
            Alpine.data('taskData', () => ({
                showNewTaskModal: false,

                // 打开新建任务模态框
                openNewTaskModal() {
                    this.showNewTaskModal = true;
                },

                // 关闭新建任务模态框
                closeNewTaskModal() {
                    this.showNewTaskModal = false;
                }
            }));
        });

        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(function() {
                const originalText = element.textContent;
                element.textContent = '已复制!';
                setTimeout(function() {
                    element.textContent = originalText;
                }, 1000);
            });
        }

        // 更新并复制时间戳
        function updateTimestamps() {
            const now = new Date();
            const secondsTimestamp = Math.floor(now.getTime() / 1000);
            const msTimestamp = now.getTime();

            // 更新显示
            document.getElementById('currentTimestamp').textContent = secondsTimestamp;
            document.getElementById('currentMsTimestamp').textContent = msTimestamp;

            // 格式化日期时间 (YYYY-MM-DD HH:MM:SS)
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedDate = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('formattedDate').textContent = formattedDate;

            // 自定义格式 (常用于记录ID: YYYYMMDDHHMMSS)
            const customFormat = `${year}${month}${day}${hours}${minutes}${seconds}`;
            document.getElementById('customFormat').textContent = customFormat;
        }

        // 复制时间戳
        function copyTimestamp(type) {
            const element = type === 'seconds' ?
                document.getElementById('copyTimestampBtn') :
                document.getElementById('copyMsTimestampBtn');
            const text = type === 'seconds' ?
                document.getElementById('currentTimestamp').textContent :
                document.getElementById('currentMsTimestamp').textContent;

            copyToClipboard(text, element);
        }

        // 复制格式化日期
        function copyFormattedDate() {
            const element = document.getElementById('copyFormattedDateBtn');
            const text = document.getElementById('formattedDate').textContent;
            copyToClipboard(text, element);
        }

        // 复制自定义格式
        function copyCustomFormat() {
            const element = document.getElementById('copyCustomFormatBtn');
            const text = document.getElementById('customFormat').textContent;
            copyToClipboard(text, element);
        }

        // 初始化并每秒更新时间戳
        updateTimestamps();
        setInterval(updateTimestamps, 1000);

        // 移动端菜单切换
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        // 监听所有导航链接的点击事件
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('a[href^="#"]');

            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();

                    const targetId = this.getAttribute('href').slice(1);
                    const targetElement = document.getElementById(targetId);

                    if (targetElement) {
                        // 打印目标元素的位置信息
                        const rect = targetElement.getBoundingClientRect();
                        console.log('导航目标:', targetId);
                        console.log('目标元素位置:', {
                            top: rect.top,
                            offsetTop: targetElement.offsetTop,
                            scrollTop: window.scrollY,
                            headerHeight: document.querySelector('header').offsetHeight
                        });

                        // 计算滚动位置
                        const headerHeight = document.querySelector('header').offsetHeight;
                        const scrollPosition = targetElement.offsetTop - headerHeight;

                        console.log('计算的滚动位置:', scrollPosition);

                        // 平滑滚动到目标位置
                        window.scrollTo({
                            top: scrollPosition,
                            behavior: 'smooth'
                        });

                        // 滚动完成后再次检查位置
                        setTimeout(() => {
                            const newRect = targetElement.getBoundingClientRect();
                            console.log('滚动后位置:', {
                                top: newRect.top,
                                scrollY: window.scrollY
                            });
                        }, 1000);
                    } else {
                        console.warn('未找到目标元素:', targetId);
                    }
                });
            });
        });

        // 监听滚动事件
        let scrollTimeout;
        window.addEventListener('scroll', function() {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                console.log('当前滚动位置:', {
                    scrollY: window.scrollY,
                    innerHeight: window.innerHeight
                });
            }, 150);
        });
    </script>

    <!-- 新建任务模态框 -->
    <div x-show="showNewTaskModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center overflow-auto" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">

        <!-- 模态框内容 -->
        <div x-show="showNewTaskModal" @click.away="showNewTaskModal = false" class="glass-card rounded-xl max-w-2xl w-full mx-4 overflow-hidden shadow-2xl" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform scale-95"
            x-transition:enter-end="opacity-100 transform scale-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 transform scale-100" x-transition:leave-end="opacity-0 transform scale-95">

            <!-- 模态框头部 -->
            <div class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">新建任务</h3>
                <button @click="showNewTaskModal = false" class="text-slate-400 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- 模态框内容 -->
            <div class="p-6">
                <form>
                    <!-- 任务类型和任务编号（放在同一行，调整宽度） -->
                    <div class="mb-4 grid grid-cols-5 gap-4">
                        <!-- 任务类型（下拉框）- 左侧，宽度减小 -->
                        <div class="col-span-2">
                            <label for="task-type" class="block text-sm font-medium text-slate-300 mb-1">任务类型</label>
                            <div class="relative">
                                <select id="task-type" class="appearance-none w-full px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-8">
                                    <option value="incoming">呼入任务</option>
                                    <option value="outgoing">呼出任务</option>
                                </select>
                                <!-- 自定义下拉箭头 -->
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- 任务编号 - 右侧，宽度增加 -->
                        <div class="col-span-3">
                            <label for="task-id" class="block text-sm font-medium text-slate-300 mb-1">任务编号</label>
                            <input type="text" id="task-id" class="w-full px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入任务编号">
                        </div>
                    </div>

                    <!-- 任务标题 -->
                    <div class="mb-4">
                        <label for="task-title" class="block text-sm font-medium text-slate-300 mb-1">任务标题</label>
                        <input type="text" id="task-title" class="w-full px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入任务标题">
                    </div>

                    <!-- 关联文档 -->
                    <div class="mb-6" x-data="{ 
                        selectedDocs: {
                            requirement: false,
                            design: false
                        } 
                    }">
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-slate-300">关联文档</label>
                            <span class="text-xs text-slate-400">如需关联多个文档，请用逗号分隔</span>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-3">
                            <label class="inline-flex items-center px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 hover:bg-blue-500/30 transition cursor-pointer" :class="{ 'ring-2 ring-blue-400': selectedDocs.requirement }">
                                <input type="checkbox" name="task-docs" value="requirement" class="sr-only" 
                                       x-model="selectedDocs.requirement">
                                <span>需求</span>
                            </label>
                            <label class="inline-flex items-center px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 hover:bg-purple-500/30 transition cursor-pointer" :class="{ 'ring-2 ring-purple-400': selectedDocs.design }">
                                <input type="checkbox" name="task-docs" value="design" class="sr-only"
                                       x-model="selectedDocs.design">
                                <span>设计</span>
                            </label>
                        </div>

                        <!-- 动态显示文档名称输入字段 -->
                        <div class="space-y-3">
                            <!-- 需求文档名称 -->
                            <div x-show="selectedDocs.requirement" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
                                <label for="requirement-doc" class="block text-sm font-medium text-blue-300 mb-1">需求文档名称</label>
                                <input type="text" id="requirement-doc" class="w-full px-4 py-2 rounded-lg bg-slate-800 border border-blue-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入需求文档名称">
                            </div>

                            <!-- 设计文档名称 -->
                            <div x-show="selectedDocs.design" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
                                <label for="design-doc" class="block text-sm font-medium text-purple-300 mb-1">设计文档名称</label>
                                <input type="text" id="design-doc" class="w-full px-4 py-2 rounded-lg bg-slate-800 border border-purple-700 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="请输入设计文档名称">
                            </div>
                        </div>
                    </div>

                    <!-- 按钮组 -->
                    <div class="flex justify-end space-x-3">
                        <button type="button" @click="showNewTaskModal = false" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-md text-sm transition">
                            取消
                        </button>
                        <button type="button" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm transition">
                            创建任务
                        </button>
                    </div>
                </form>
            </div>

            <!-- 添加自定义样式以优化下拉框 -->
            <style>
                /* 自定义下拉框样式 */
                
                select {
                    background-image: none;
                    /* 移除默认箭头 */
                }
                /* 自定义下拉选项样式 */
                
                select option {
                    background-color: #1e293b;
                    /* 深色背景 */
                    color: white;
                    padding: 10px;
                }
                /* 下拉框激活时的样式 */
                
                select:focus {
                    border-color: #3b82f6;
                    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
                }
            </style>
        </div>
    </div>

    <!-- 添加脚本来加载组件 -->
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载任务列表组件
            loadComponent('tasklist-container', 'TaskListComponent.html');

            // 加载工作日志组件
            loadComponent('worklog-container', 'WorkLogComponent.html');

            // 加载快速访问组件
            loadComponent('quickaccess-container', 'QuickAccessComponent.html');

            // 加载实用工具组件
            loadComponent('tools-container', 'ToolsComponent.html');

            // 通用加载组件函数
            function loadComponent(containerId, componentFile) {
                const container = document.getElementById(containerId);

                fetch(componentFile)
                    .then(response => response.text())
                    .then(html => {
                        container.innerHTML = html;
                        // 如果需要重新初始化Alpine组件
                        if (typeof Alpine !== 'undefined') {
                            Alpine.initTree(container);
                        }
                    })
                    .catch(error => {
                        console.error(`加载组件 ${componentFile} 失败:`, error);
                        container.innerHTML = `<div class="p-4 text-red-500">加载组件 ${componentFile} 失败</div>`;
                    });
            }
        });
    </script>
</body>

</html>
