<section id="worklog" class="mb-12 glass rounded-xl overflow-hidden shadow-2xl">
    <div class="p-6" x-data="{ 
        logContent: '', 
        characterCount: 0, 
        maxLength: 500,
        logs: [],
        currentDate: new Date().toISOString().split('T')[0],
        
        submitLog() {
            if (this.logContent.trim() === '') return;
            
            const newLog = {
                id: Date.now(),
                content: this.logContent,
                date: this.currentDate,
                tags: ['开发'] // 默认标签，可以扩展为动态选择
            };
            
            this.logs.unshift(newLog);
            this.logContent = '';
            this.characterCount = 0;
            
            // 保存到本地存储
            localStorage.setItem('workLogs', JSON.stringify(this.logs));
        },
        
        deleteLog(id) {
            this.logs = this.logs.filter(log => log.id !== id);
            localStorage.setItem('workLogs', JSON.stringify(this.logs));
        },
        
        copyLog(content) {
            navigator.clipboard.writeText(content)
                .then(() => {
                    // 使用更友好的提示而不是alert
                    const toast = document.createElement('div');
                    toast.className = 'fixed bottom-4 right-4 bg-blue-600 text-white px-4 py-2 rounded shadow-lg';
                    toast.textContent = '日志已复制到剪贴板';
                    document.body.appendChild(toast);
                    setTimeout(() => {
                        toast.remove();
                    }, 2000);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                });
        },
        
        formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            });
        }
    }" x-init="
        // 从本地存储加载日志
        const savedLogs = localStorage.getItem('workLogs');
        if (savedLogs) {
            logs = JSON.parse(savedLogs);
        }
    ">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">工作日志</h2>
        </div>

        <!-- 日志输入表单 -->
        <div class="glass-card rounded-lg p-4 border-l-4 border-blue-500 mb-6">
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <label for="logContent" class="text-white font-medium">今日工作内容</label>
                    <span class="text-xs text-slate-400" x-text="`${characterCount}/${maxLength}`"></span>
                </div>
                <textarea id="logContent" x-model="logContent" @input="characterCount = logContent.length" class="w-full bg-slate-800/50 border border-slate-700 rounded-md p-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                    placeholder="记录今天完成的工作内容、遇到的问题和解决方案..." rows="4" maxlength="500"></textarea>
            </div>

            <!-- 标签选择 -->
            <div class="mb-4">
                <label class="text-white font-medium block mb-2">添加标签</label>
                <div class="flex flex-wrap gap-2">
                    <button class="px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 hover:bg-blue-500/30 transition text-sm">
                        需求分析
                    </button>
                    <button class="px-3 py-1 rounded-full bg-green-500/20 text-green-300 hover:bg-green-500/30 transition text-sm">
                        开发
                    </button>
                    <button class="px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 hover:bg-purple-500/30 transition text-sm">
                        设计
                    </button>
                    <button class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 transition text-sm">
                        测试
                    </button>
                    <button class="px-3 py-1 rounded-full bg-red-500/20 text-red-300 hover:bg-red-500/30 transition text-sm">
                        Bug修复
                    </button>
                    <button class="px-3 py-1 rounded-full bg-slate-500/20 text-slate-300 hover:bg-slate-500/30 transition text-sm">
                        会议
                    </button>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-end space-x-3">
                <button @click="logContent = ''; characterCount = 0" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-md text-sm transition">
                    清空
                </button>
                <button @click="submitLog()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm transition">
                    提交日志
                </button>
            </div>
        </div>

        <!-- 日志列表 -->
        <div>
            <h3 class="text-lg font-semibold text-slate-300 mb-3 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg> 工作日志记录
            </h3>

            <!-- 日志列表 -->
            <div class="space-y-4">
                <template x-for="log in logs" :key="log.id">
                    <div class="glass-card rounded-lg p-4 border-l-4 border-slate-500">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center mb-2">
                                    <div class="text-xs text-slate-400 mr-3" x-text="formatDate(log.date)"></div>
                                    <div class="flex space-x-1">
                                        <template x-for="tag in log.tags" :key="tag">
                                            <span class="text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-300" x-text="tag"></span>
                                        </template>
            </div>
        </div>
        <p class="text-white mb-2" x-text="log.content"></p>
    </div>
    <div class="ml-4 flex-shrink-0 flex space-x-2">
        <button @click="copyLog(log.content)" class="p-1 rounded hover:bg-slate-700/50 transition" title="复制日志">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                    </svg>
                                </button>
        <button @click="deleteLog(log.id)" class="p-1 rounded hover:bg-slate-700/50 transition" title="删除日志">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 hover:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
    </div>
    </div>
    </div>
    </template>

    <!-- 无日志时显示 -->
    <div x-show="logs.length === 0" class="text-center py-8 text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
        <p>暂无工作日志记录</p>
        <p class="text-sm mt-2">记录你的工作内容，帮助你更好地管理工作进度</p>
    </div>
    </div>

    <!-- 加载更多按钮 -->
    <div class="flex justify-center mt-6" x-show="logs.length > 0">
        <button class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-md text-sm transition">
                    加载更多
                </button>
    </div>
    </div>
    </div>
</section>
